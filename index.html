const BOOK = {"title": "幸福的勇气：\"自我启发之父\"阿德勒的哲学课2", "tracks": [{"index": 1, "title": "序章 人们误解了阿德勒思想", "file": "audio/xingfu_deyongqi/01_序章_人们误解了阿德勒思想.mp3", "duration": 465}, {"index": 2, "title": "第一章 可恶的他人可怜的自己", "file": "audio/xingfu_deyongqi/02_第一章_可恶的他人可怜的自己.mp3", "duration": 673}, {"index": 3, "title": "第二章 为何要否定赏罚", "file": "audio/xingfu_deyongqi/03_第二章_为何要否定赏罚.mp3", "duration": 902}, {"index": 4, "title": "第三章 由竞争原理到协作原理", "file": "audio/xingfu_deyongqi/04_第三章_由竞争原理到协作原理.mp3", "duration": 654}, {"index": 5, "title": "第四章 付出然后才有收获", "file": "audio/xingfu_deyongqi/05_第四章_付出然后才有收获.mp3", "duration": 751}, {"index": 6, "title": "第五章 选择爱的人生", "file": "audio/xingfu_deyongqi/06_第五章_选择爱的人生.mp3", "duration": 833}], "transcripts": [{"title": "序章 人们误解了阿德勒思想", "text": "各位朋友，欢迎打开《幸福的勇气》的听读时光。\n\n这本书的副标题是\"自我启发之父阿德勒的哲学课2\"，作者是日本的岸见一郎与古贺史健，译者是渠海霞。它是著名的\"勇气两部曲\"的下卷，也是完结篇。上卷《被讨厌的勇气》追问的是——\"人究竟该怎么做，才能获得自由\"；而这一卷《幸福的勇气》，要往前再走一步，去回答那个更让人坐立难安的问题：\"人该怎么做，才能获得幸福？\"\n\n两本书共用同一个迷人的壳子：一间书房，一位愤世嫉俗、代表常识的青年，一位笃信阿德勒、代表哲学的哲人，一场又一场披着对话外衣的思想交锋。如果说上卷是青年初次叩门，被阿德勒的思想冲击得溃不成军；那么这一卷的故事，发生在三年之后。\n\n三年前，青年带着满腹疑惑离开，他以为自己抓住了钥匙：世界很简单，人生也一样；人的一切烦恼都来自人际关系；而获得自由的法门，是\"课题分离\"，是拥有\"被讨厌的勇气\"。可三年过去，生活递给他的是另一副面孔——\n\n这一回，青年已经是一名小学老师了。他揣着满腔热情走上讲台，却在真实的教育现场碰得头破血流。那些在书房里闪闪发光的阿德勒式道理，在吵闹的教室、在顽劣的学生面前，似乎全都失灵了。于是，怀着截然不同的心情，他再一次推开了哲人的门。但这一次，他不是来叙旧的，而是来\"算账\"的。他开门见山：阿德勒思想是一场骗局，是一种影响恶劣的危险思想；他今天来，就是要当着哲人的面，把它彻底抛弃。\n\n这就是全书开篇那段极具戏剧张力的设定。青年从三年前的\"盲目崇拜\"，变成了如今的\"满腹狐疑\"。而哲人并不慌张。他说：任何一种学说，都要走出书斋，去接受现实的考验和质疑。当初阿德勒的思想，正是在心理咨询和教育这两个领域应用得最深最广；如今，正需要到实践中去证明它的生命力。\n\n在正式走进对话之前，我想先和你聊聊这本书的气质。几位推荐序里，有人把阿德勒的思想比作人生的一剂\"猛药\"。为什么是猛药？因为它一点都不让人舒服，相反，它让人恐惧。它逼你承认：无论你经历过怎样的过去、遭受过怎样的不幸，都不该以\"受害者\"自居；在\"可怜的自己\"和\"可恶的他人\"之外，你真正该想的是\"怎么办\"。它要求你在和老板意见相左时，遵循课题分离——你以你的方式工作，那是你的事；老板要骂你、要开除你，那是老板的事。它要求你对待孩子，既不批评也不表扬，而是把他当作一个平等独立的个体去尊重。它要求你，一旦决定信赖一个人，就无条件地信赖，不计后果，不怕受伤。而在爱情里，它干脆说：根本不存在什么\"命中注定的人\"，如果你决定爱他，那他就是对的人。\n\n听下来，你是不是也和书里的青年一样，觉得这位哲人简直像古希腊那位用\"歪理邪说\"蛊惑年轻人的苏格拉底，活该被处死？可偏偏，当你把每一句拆开细想，又会发现里头有几分道理。而这些道理之所以难以下咽，恰恰是因为它们要求你放弃一样东西——对他人和环境的控制与期待。\n\n那么，阿德勒口中的\"幸福\"到底长什么样？书里给了一个沉甸甸的答案：幸福，归根到底源于\"自立\"。可\"自立\"这两个字，比我们想象的要艰难、要沉重得多。阿德勒说，他的理论以教育为目的，最终是教人自立。什么叫自立？它意味着放弃对他人和环境的控制期待，以此换回自己的自主权；意味着在与人交往时，不计过去、不畏将来、不求认可、不求回报。更彻底的是，自立的终点，是\"消除自我\"——承认自己不过是个普通人，不从社会序列里、不从别人的认同里寻找自我价值，而只从自己的所作所为里寻找。\n\n这样的幸福，你还想要吗？因为自立的背后，是\"无边的孤独\"。一个在心理上真正断乳的人，不再对亲人、朋友、同事怀有\"理所当然\"的期待；他可以求助，但别人伸不伸手，是别人的课题，与他无关。他失去了抱怨的资格，却也因此获得了一种全然的自由——他能够选择自己对待生活的态度。一个信奉阿德勒的人，是人群中的隐者；但正是去掉了那些不纯粹的联系，才剩下了阿德勒最看重的\"爱\"：作为独立个体，彼此发自内心的尊重、关心与兴趣，全情投入的信赖、不求回报的奉献。而这，才是阿德勒式幸福的含义。\n\n所以你看，这本书递给我们的，从来不是一碗温柔的鸡汤，而是一份需要勇气的契约。它要我们在教育的现场、在爱的现场、在一切人际关系的现场，去回答最难的问题。在接下来的几讲里，我们会陪着青年与哲人，走完这场\"最后的决斗\"。我们会读到：阿德勒的思想到底是不是一种宗教；为什么教育既不可以批评也不可以表扬；为什么\"问题行为\"背后藏着孩子求关注的真实目的；为什么表扬其实是一种精心包装的操纵；为什么爱不是被动坠入的命运，而是需要用意志去培养、去决断的人生课题。\n\n书的结尾，哲人留给青年最后一句话，也是留给我们所有人的一句话——\"主动去爱、自立起来、选择人生。\"而这本书的全部重量，都浓缩在另一声叹息里：\"世界很简单，人生也是一样。但是，保持单纯很难。\"\n\n愿这趟听读，能陪你一点点，接住这份勇气。\n"}, {"title": "第一章 可恶的他人可怜的自己", "text": "各位朋友，我们进入《幸福的勇气》的第一章——\"可恶的他人，可怜的自己\"。\n\n三年前，青年是被阿德勒的思想震住的那个听众；三年后，他带着小学老师的实战经验回来了，而且，他变了。他不再满足于抽象、理想、看上去很美的大道理。他亮出了自己的新策略：不要听理论式、理想性的话，一定要听具体化、实践式、现实性的话。因为他知道，阿德勒的弱点，恰恰就在\"落地\"这一环。\n\n于是这一章，几乎是一场\"逼供\"。青年像一位检察官，要把哲人从那根思考的竹竿上摇落下来。\n\n他抛出的第一个难题就很尖锐：阿德勒哲学，说到底是不是一种宗教？你看，阿德勒描绘的理想状态——人人自立、共同体感觉、无条件信赖——这些都不是可以用科学验证的东西。只要不是科学，最后总会滑入\"信或不信\"的信仰层面。从我们的角度看，不了解阿德勒的人像信奉伪神的野蛮人；可换到对方眼里，也许我们才是该被救济的那一个。那么，阿德勒哲学和宗教，到底有什么区别？\n\n哲人的回答，值得你慢慢品味。他说，宗教、哲学、科学，出发点其实是同一个：我们从哪里来，我们在哪里，然后，我们该如何活着。区别在于，科学只认定客观事实，而哲学和宗教都深入人类的\"真善美\"。那它们俩的分界线呢？不是有没有神，而是——有没有\"故事\"。宗教是用故事来解释世界的，神，就是说明世界的那个重大故事的主人公；而哲学拒绝故事，它用没有主人公的抽象概念来解释世界。\n\n哲人打了一个极妙的比方。为了探索真理，我们都在一根向黑暗无限延伸的竹竿上拼命攀爬，质疑常识，反复自问自答。偶尔，黑暗里会传来一个声音：\"再往前也没什么了，这里就是真理。\"有人听从了这声音，停下脚步，从竹竿上跳了下去——不管那里有没有真理，这种\"停止攀登、中途跳下\"，哲人称它为宗教。而哲学，是永不止步。\n\n所以哲学又叫\"爱知学\"，哲学家是\"爱知者\"。一旦你自以为成了无所不知的\"知者\"，你反而就不再是从前那个爱知者了。康德有句名言：\"我们无法学习哲学，我们只能学习如何从事哲学。\"哲学不是一门学问，而是一种生存的态度。哲人说，哪怕有人自称\"自己明了一切\"而停止思考，不管他信不信神，那个人其实已经步入了宗教。所以，阿德勒的思想不是要你\"信\"，而是邀请你和他一起，朝着竹竿的无边尽头，一直追问、一直前进。\n\n顺着这个理路，青年把火引向了教育。他说，阿德勒不是讲\"课题分离\"吗？学习是孩子的课题，父母不该干涉。那\"教育\"到底是什么？难道我们这些强迫孩子学习的教育者，全都是粗暴干涉他人课题的不法侵入者？\n\n哲人接住了这一刀。他说，你说得对，学习确实是孩子的课题，父母不该妄加干涉。但阿德勒，恰恰是有史以来最热心教育的心理学家之一。对阿德勒来说，教育不仅是中心课题，更是最大的希望。在阿德勒心理学里，心理咨询不叫\"治疗\"，而叫\"再教育\"的机会——心理咨询师，就是教育者；教育者，就是心理咨询师。\n\n那么教育的目标是什么？一句话：自立。阿德勒心理学为人的发展立了四个目标。行为方面有两个：一是自立，二是与社会和谐共处。支撑它们的，是心理方面的两个意识：一是\"我有能力\"的意识，二是\"人人都是我的伙伴\"的意识。教育的本质，不是干涉，而是\"帮助\"其自立。就像一个人不懂交通规则就不能被放到马路上，教育要传授的，不只是书本学问，更是\"人如何幸福生活的人格知识\"——关于如何在共同体中立足，如何认识\"我\"、认识\"你\"。这种知识，没法从书里读来，只能从人与人的交往实践中习得。\n\n可青年不买账。他说，先生您总是归于抽象的理想论，总是看远处的风景，却不肯看脚下的泥泞。教育者具体该踏出的第一步，到底是什么？\n\n哲人吐出两个字：尊重。\n\n这就是本章最动人的一段。尊重，不是\"尊重父母\"\"尊重上司\"那种自上而下的姿态，而是——首先，\"你\"要对孩子们心怀尊重，一切都从这里开始。哲人引用了与阿德勒同时代、为躲避纳粹从德国逃到美国的社会心理学家埃里克·弗洛姆的话：\"尊重就是实事求是地看待一个人，并认识到其独特个性的能力。\"更进一步，尊重，就是努力使对方能成长和发展自己。\n\n请注意，这不是道德说教，更不是宗教。尊重，是不试图改变或操控眼前的他人，不附加任何条件地去认可\"真实的那个人\"。哲人说，尊重也是\"鼓励\"的根源——假如有人能认可真实的自己，那个人就会获得巨大的勇气。而\"尊重\"这个词，语源是拉丁语的\"respicio\"，本意就是\"看\"。首先要去看真实的那个人，不要把自己的价值观强加于人，而是努力发现那个人本身的价值，并帮助他成长。在企图操控和矫正他人的态度里，根本没有丝毫尊重。\n\n这里有一个让人脊背发凉的洞察：在这个世界上，无论多么有权势的人，都无法强迫的事情，只有两样——尊重和爱。你可以命令员工服从，但那只是基于恐惧的服从，里面没有一丁点尊重；你越是高呼\"必须尊重我\"，别人越会离心离德。就像那句谚语：即使你能把马带到水边，也无法强迫它喝水。教育者也一样，哪怕你再优秀，也无法保证学生一定会改变；但正因为无法保证，才更需要无条件的尊重。踏出最初一步的，必须是\"你\"。\n\n青年又追问：那\"关心他人兴趣\"又是什么？这其实指向阿德勒的核心概念——共同体感觉。哲人用\"共鸣\"来解释它。他说，我们无法脱离主观，也不可能真的变成他人；但我们可以想象——\"假如我拥有和此人一样的心灵和人生情况，会如何？\"当你这样想，你就会意识到\"自己一定也会面临和他一样的课题\"，于是便能理解他。这不是简单的\"我也是一样的心情\"式的赞同，而是真正的共鸣。比如面对一个根本不想学习的孩子，与其质问\"你为什么不学习\"，不如去想象：假如我和他处于同样的年纪、同样的家庭、同样的朋友圈，我在\"学习\"这个课题上，会采取什么样的态度，又为什么会拒绝学习？这种态度，就叫共鸣。\n\n讲到这里，第一夜的对话暂时停在了咖啡香里。青年开始隐约明白，哲人说的那些话，并不是悬在半空的理想，而是要在每一段具体的关系里，由\"你\"先踏出第一步。下一章，他会把这把火，烧向一个更棘手、也更日常的问题——为什么阿德勒说，教育既不可以批评，也不可以表扬？\n"}, {"title": "第二章 为何要否定赏罚", "text": "各位朋友，我们来到《幸福的勇气》的第二章——\"为何要否定赏罚\"。\n\n上一章，哲人把教育的入口指向了\"尊重\"。可这一章，青年要揪住一个最现实、也最刺人的问题不放：您说的这套漂亮话，在真实的教室里管用吗？班级秩序混乱，难道不需要规则和惩罚？学生做了坏事、打扰别人，就放任不管？如果\"不批评\"教育失败了，是不是恰恰证明，赏罚还是有必要的？\n\n青年先抛出一个比方：把你的班级，看作一个民主国家。他说，班级的主权不属于教师，而属于学生们；班级的规则，必须根据学生们的协商来制定。哲人点头：没错，民主国家主权在国民，规则由国民协议制定、平等适用。可问题在于——如果规则由某个人独断，而且执行得并不平等，那这个组织就只能靠\"力量\"来控制，从根本上就是不合理的。\n\n哲人一针见血：青年，你其实沾染了一种\"法西斯主义\"。如果教师不经学生\"选举\"，就自命为班级的总统、领导，那他就是个独裁者。而班级秩序之所以混乱，不只是学生个人的问题，也有教师\"资质不够\"的原因——正因为这是一个腐败的独裁国家，所以才会秩序混乱。顺着这个逻辑，哲人点出青年反复强调、视若珍宝的东西，正是\"赏罚\"。\n\n好，那就从赏罚谈起。阿德勒有一个听起来近乎冷酷的主张：既不可以批评，也不可以表扬。\n\n为什么不能批评？哲人分了两种情况。一种是，孩子做了坏事，可能只是\"他并不知道这是不好的事情\"。这里有个让人心软的例子：哲人小时候，拿着放大镜观察昆虫，后来发现聚光可以烧黑纸，某个夏天，他把光聚到一只\"浑身裹着乌黑坚固铠甲的大蚂蚁\"身上……至于之后发生了什么，就不用多说了。青年脱口而出：\"孩子本来就残忍。\"哲人纠正他说：孩子们不是残忍，只是\"不知道\"生命的价值和他人的痛苦。所以大人该做的，不是斥责，而是用理性的语言去教导，而且在教的时候，不需要责备性的语言。\n\n另一种情况是，孩子\"明知故犯\"。那也不是因为他没冷静思考，而是背后有更深的——心理动机。这正是阿德勒最独特的视角：不要只盯着\"行为\"，要去看行为背后的\"目的\"。\n\n阿德勒把问题行为的目的，分成五个阶段。第一个阶段叫\"称赞的要求\"：孩子扮演\"好孩子\"，目的只是获得表扬、在共同体里取得特权地位。他的生活方式是——\"如果没人表扬，就不干好事\"。所以你看，为什么不能表扬？因为表扬本身就是一种评价，它悄悄把孩子的动力，绑在了\"被认可\"这根绳上。\n\n如果得不到表扬，孩子就会滑向第二阶段——\"引起关注\"。他的行为原理不是\"办坏事\"，而是\"与众不同\"：通过恶作剧，甚至通过\"扮演无能\"，来博取大人的目光。哲人有一句让人心惊的话：\"比起自己的存在被无视，被批评要好得多。\"被骂，也好过被看不见。\n\n再往后，是\"权力争斗\"——不服从、反复挑衅，企图用胜利炫耀力量；是\"复仇\"——在憎恶的感情中关注我，故意做对方讨厌的事来建立联结；是\"证明无能\"——放弃一切，想尽办法证明自己不行，他的愿望是\"请不要对我有任何期待\"。哲人总结：这一切，都根源于一个目的——\"归属感\"，也就是\"确保自己在共同体中的特别地位\"。好在，大部分问题行为只停留在第三阶段，教育者在防止恶化上，作用巨大。\n\n讲到这儿，青年终于亮出自己的伤疤。他说，他确实实践过阿德勒式的\"不批评\"——无论发生什么都不批评，只是等着孩子们自我觉悟。结果呢？教室里毫无规矩，简直就像动物园！后来他改为大声呵斥，当场果然安静了，孩子们还流露出反省的表情。可过不了多久，他们又开始捣乱、不写作业。他甚至后悔：明年再接新班，要从第一天起就严加批评。\n\n哲人微微一笑，给了他一记回马枪：如果\"批评\"真的有效，那么那些总是发火的严厉老师，为什么需要\"总是\"发火？\"这最好地证明了，'批评'这一手段在教育上没有任何效果。\"因为，问题行为里，甚至已经包含了\"被你批评\"这一项——\"被斥责，正是他们希望的事情\"。孩子通过被训斥，证明了自己是\"特别的存在\"。青年又举拳击比赛为例，说惩罚是必要的抑制力。哲人反问：那为什么你的斥责，没在教育现场发挥抑制力？\n\n更深的洞见来了：如果批评是为了维护法律和秩序，那阿德勒会说，\"要放弃法官的立场\"。教育者就是心理咨询师，心理咨询就是再教育——你该守护的，是\"眼前的孩子\"，而不是什么抽象的法律与秩序。\n\n最后一节，\"以暴力为名的交流\"，把话题推向了成人的不成熟。哲人拿出一面\"三棱柱\"：一面是\"可恶的他人\"，一面是\"可怜的自己\"，一面是\"以后怎么做\"。当学生打架，青年习惯先查明\"是谁的错\"，然后让错的一方道歉，各打五十大板。哲人说，学生说的\"因为他先说了那样的话，所以我才生气\"，全是前两面里的辩解；真正该问的，是第三面——\"以后怎么做\"。只追问原因，得到的永远是推卸责任之词。\n\n而一旦厌烦了语言的交锋、无望获胜，人就会选择\"暴力\"。哲人说：\"暴力始终是成本低、廉价的交流手段。\"发怒和训斥，同义；高声吼叫、拍桌子、泪流满面，都是低成本的\"暴力性\"交流。阿德勒讲：\"发怒是使人和人之间变得疏远的感情。\"遭到斥责的孩子，会无意识地洞察到——\"这个人很不成熟\"。伴随发怒或暴力的交流里，根本不存在尊重，只会招致蔑视。\n\n这一章的落点，沉甸甸的。哲人点破青年一个潜意识的真相：你嘴上说希望学生自立，其实，你很害怕学生们自立。因为一旦学生自立、与教师站在平等的位置，你的权威就会丧失；而学生若失败，你又会被问责，所以为了保全自身，你宁愿支配孩子，不允许他们冒险。真正的教育，是\"尊重孩子们自己的决断，并帮助其做出决断\"，在\"不太近、但可以随时提供帮助\"的距离上守护，让学生学到那句最关键的话——\"自己的人生，可以由自己选择\"。而教育者，要在奉献的精神里，找到自己的幸福。\n\n下一章，我们会继续这场交锋，去碰一个更隐蔽的陷阱：为什么连\"表扬\"，也是一种操纵？\n"}, {"title": "第三章 由竞争原理到协作原理", "text": "各位朋友，我们来到《幸福的勇气》的第三章——\"由竞争原理到协作原理\"。\n\n上一章，哲人说教育不可以批评，也不可以表扬。青年在第二章已经被\"不批评\"弄得够呛，这一章，他要死磕的，是\"不表扬\"。他手里，甚至攥着一枚看似无可辩驳的筹码。\n\n事情是这样的：班里有个数得着的问题学生，暑假读了加缪的《异邦人》，写出了一篇细腻感性的读后感。青年一时没忍住，脱口表扬：\"你太厉害啦！我都不知道你竟能写出这么好的作文，真令我刮目相看啊！\"那个孩子，露出了以前从未有过的、极其天真烂漫的少年式的笑脸。青年像抓住了什么，反问哲人：你看，表扬带来了多好的良性循环！阿德勒的教育里，到底有什么温度和笑容？\n\n哲人没有被带偏。他平静地说：我们要想的是——\"为什么不可以表扬\"，以及\"通过表扬，要承担什么样的风险\"。\n\n风险，藏在\"竞争\"两个字里。在一个靠赏罚分明的独裁式共同体里，人们顺从的目的，其实只是为了\"获得表扬\"，或者\"不被批评\"。可一旦把\"褒奖\"设为目标，这个共同体，就会被\"竞争原理\"支配。你看见别人被表扬，就愤懑；自己被表扬，就得意；心里盘算的，是如何比别人更早、更多地抢到表扬，如何独占那份宠爱。竞争，会让原本的盟友，变成应被打倒的敌人，慢慢塑成一种\"他人都是敌人\"的生活方式，一种世界观。\n\n哲人讲了一个让人脊背发凉的判断：当一个孩子出问题，教育者习惯把\"有问题的个人\"单独拎出来处理。可阿德勒心理学看的是整体——\"不是他一个人患了肺炎，而是整个班级，都患了重度肺炎。\"这种病的名字，叫\"竞争原理\"。孩子的问题行为，只是症状。真正要治疗的，不是哪一个人，而是整个共同体本身：停止赏罚，消除竞争，让竞争原理从班级里消失。\n\n竞争原理，发展出来的是\"纵向关系\"——居高临下的评价与被评价；而阿德勒主张的，是\"协作原理\"支撑的\"横向关系\"。在这个意义上，阿德勒心理学，是一门基于横向关系的\"民主心理学\"。\n\n那么，人为什么非要竞争不可？哲人把镜头拉回童年。我们人类在孩童时代，毫无例外都抱着自卑感生活——心理的成长，总是跑在身体发育的前头，孩子因\"想做\"与\"能做\"之间的落差而苦恼，在体会自己的\"不完美\"中自卑。但自卑感，从来不是坏事，它是努力与成长的催化剂。文明，就是用来填补人类生物性弱点的产物；人类史，就是一部克服劣等性的历史。正因为我们脆弱，才组成共同体，在协作的关系里生存。而所有人内心，都天然带着\"共同体感觉\"——它不是需要去\"掌握\"的外物，而是需要从自己内心去\"挖掘\"的宝藏。\n\n由此，哲人点破了\"表扬\"最隐蔽的危害。通过表扬获得的\"价值\"，是依赖外部作用的，就像一个\"带发条装置的玩偶\"——只有被上紧发条（被表扬），才会动，才会幸福。真正的解法，是不去寻求他人的认同，而按自己的意思\"自我认同\"。\"我\"的价值，由自己来决定，这，才叫自立。不要从\"与他人不同\"里寻找价值，而要从\"保持自我\"里寻找价值——这，需要一种\"做普通人的勇气\"。\n\n青年还不服：人格的形成，是家庭的责任，教师顶多做\"狭义的教育\"。哲人驳回：阿德勒把人的一切言行，都放在人际关系里思考。同一个学生，给父母、给老师、给朋友看的，是三张不同的面孔。他在你面前做出问题行为，就是\"针对你\"才行动的——他是在向你求助，是在这个教室里，寻找自己的位置。所以，必须先由你，在教室里通过尊重，把他的位置展示出来。\n\n讲到这里，哲人突然把话锋，转向了青年自己。他说：你选择当教育者，嘴上说是为了拯救孩子，可你真正想拯救的，难道不是你自己吗？这是一种\"弥赛亚情结\"——无法消除自卑感的人，会陷入一种优越情结，妄想通过拯救别人，最终让自己获救。你那些高声的怒吼，本身也是自卑感的表现。一个自己都不幸的人，提供的救助只是自我满足，无法让任何人真正幸福。你首先该做的，是\"用自己的手去获得幸福\"。否则，这场对话，不过是两人在原地对骂。\n\n这一章最动人、也最颠覆的一个例子，是阿德勒本人的故事。有一位患病八年的少女，像狗一样狂吠，口水不断，撕衣服、吃手绢。阿德勒连续三十天和她谈话，她终于开口。某一天，她突然动手打阿德勒，阿德勒不反抗，任她拍打；她打破玻璃，手指受伤，阿德勒默默为她包扎。为什么？因为那一刻，阿德勒感受到的是——\"我是他的朋友\"。他不是作为一个拿报酬的职业人，而是作为\"一个朋友\"，去面对她。\n\n哲人由此点出全章的题眼：教育，不是\"工作\"，而是\"交友\"。教育者就是心理咨询师——你该作为\"一个朋友\"去面对学生，建立真正意义上\"交友\"的关系，而不是仅仅把它当成一份差事。因为，青年一直逃避的，正是\"工作、交友和爱\"这三大人生课题。而爱，是其中最难、也最靠近幸福尽头的一关。\n\n下一章，我们就将跨过这道门，去谈一个贯穿全书的关键词——信赖。为什么哪怕被辜负，也要无条件地相信眼前的人？为什么\"付出，然后才有收获\"？\n"}, {"title": "第四章 付出然后才有收获", "text": "各位朋友，我们来到《幸福的勇气》的第四章——\"付出，然后才有收获\"。\n\n前面三章，哲人把教育的入口，一步步引到了\"尊重\"与\"交友\"。可青年心里，还横着一道坎：凭什么？凭什么我要先尊重、先信赖那些根本不尊重我、也不信赖我的学生？难道不该是别人先对我好，我再去对别人好吗？\n\n这一章，哲人要用\"人际关系\"这把钥匙，去开这道锁。\n\n他先补上了那句著名判语的另一半。我们都听过\"一切烦恼，都是人际关系的烦恼\"；可它的背面是——\"一切快乐，也都是人际关系的快乐\"。哲人请你做个思想实验：假如这个宇宙，只有\"我\"一个人，那会怎样？没有语言，因为没有交谈的对象；没有竞争，因为没有比较的对手；没有孤独，因为孤独只能存在于\"关系\"之中；当然，也没有快乐。人，根本无法脱离他人而生存。所以阿德勒把人在社会里必须面对的课题，称为\"人生课题\"，分为三项：工作的课题、交友的课题、爱的课题。它们的本质，全都是\"关系\"的课题。而学校，正是孩子们最初学习\"交友\"、挖掘共同体感觉的地方。\n\n那么，\"信任\"和\"信赖\"，到底差在哪？青年用银行贷款打比方，一下子就说清了\"信任\"：银行不是\"因为相信你\"才放贷，而是\"因为相信你准备的担保价值\"才放贷——它相信的，是\"条件\"，不是\"那个人\"。而\"信赖\"，是在相信他人时不附加任何条件，相信的是\"那个人本身\"。哲人说，只有信赖自己，才能信赖他人。工作关系，是\"信任\"关系——它由利害、由外部要素结成，附带条件；而交友关系，是\"信赖\"关系——它由\"喜欢这个人\"这样的内在动机结成。\n\n为什么\"工作\"会成为人生的课题？哲人把视线拉回人类的来处。在严酷的自然里，人类身体上毫无优势——没有利齿，没有翅膀，没有甲壳。于是我们过集体生活，发明出\"分工\"这一生存战略。有人擅长造弓箭却不善狩猎，便专心造弓、分发给擅长狩猎的同伴，再分得猎物，双方利益最大化。阿德勒，是从心理学、从人际关系的角度，第一个倡导\"分工\"意义的人。他有一句掷地有声的话：\"如果我们生活在不需要劳动就可以获得一切的行星上，那也许懒惰就会是美德，而勤勉是恶习。\"可惜地球不是那样的地方，所以——\"我们应该劳动、协作、贡献。\"\n\n在分工的体系里，职业不分贵贱。国家元首、老板、农民、工人、专职主妇，一切工作，都是\"共同体中必须有人去做的事情\"，只是分工不同。阿德勒说：\"人的价值，由如何完成共同体中自己被分配的分工任务来决定。\"决定人价值的，不是\"从事什么样的工作\"，而是\"以什么样的态度致力\"于自己的工作。一个有趣的辩证法出现了：在分工社会里，把\"利己\"发展到极致，结果反而通向了\"利他\"——追求利己心的尽头，就是\"他者贡献\"。但要小心，别醉心于\"何为善、何为恶\"的正义，否则容易变成\"正义的干涉\"，反而剥夺了别人的自由。\n\n话题回到\"信赖\"。哲人给出了一个三段论：尊重，就是实事求是地看待一个人、认识到其独特个性；而尊重，等于信赖；基于信赖的关系，就是交友关系。所以教育的入口是尊重，尊重就是信赖，而信赖的关系，就是交友。问题的关键，不在\"信赖\"这个行为本身，而在它的\"对象\"——你能不能无条件地信赖每一个学生？\n\n阿德勒的答案很硬：\"重要的不是被给予了什么，而是如何去利用被给予的东西。\"无论面对什么样的对象，你都可以去尊重、去信赖；这不被环境左右，也不被对象左右，它只取决于你自己的决心与勇气。\n\n青年讲起自己的挚友：是大学同学，一起欢笑、一起惊叹、一起干点小坏事，慢慢培养出友情，直到确信可以推心置腹，才成为挚友。他说，在普通朋友面前要戴\"社交面具\"，是为了避免受伤、避免关系破裂；只有在挚友面前，才敢摘下面具，而关系也不会因此破裂。哲人静静地听完，说：我也有这样的朋友。\"比如你。\"他说，\"对我来说，你是不可替代的朋友之一，我在你面前，从未戴过任何面具。\"青年几乎炸毛：\"撒谎！你这个伪君子！\"——可这正是\"主动信赖\"最锋利的演示：哪怕你并不信赖我，我也信赖你，继续信赖。\n\n哲人把\"信赖\"说透了：信赖不是盲信，你可以质疑思想信条、独立思考，但你仍然\"即使那个人撒了谎，也依然相信撒了谎的那个人\"。真正的信赖，是彻彻底底的能动行为。我们为什么只能相信\"信赖自己的人\"？因为我们根本不可能完全理解对方——\"正因为我们人类是无法互相理解的存在，所以才只能选择信赖。\"《路加福音》说\"像爱你自己一样爱你的邻人\"；不能爱自己，就无法爱他人；不能信赖自己，就无法信赖他人。青年\"无法信赖他人\"的根源，其实是无法彻底信赖自己。\n\n这一章的尾声，哲人讲起一战中作为军医的阿德勒：他的任务是把士兵治好，再送回前线，他说自己\"品味到了犯人一样的感觉\"。与弗洛伊德提出\"死亡驱力\"相反，阿德勒提出了\"共同体感觉\"，去探索如何阻止战争。特蕾莎修女说：\"回家之后，请善待家人。\"阿德勒也一样——首先信赖眼前的人，与眼前的人交朋友。他说：\"必须有人开始。即使别人不合作，那也与你无关……应该由你开始。\"平凡的日常生活，本身就是一场考验，在\"此时此刻\"的日常里，也需要做出重大的决断。\n\n最后，哲人点破青年的算盘：你总想着\"别人先尊重我，我才尊重他们；先通过工作证明价值，再谈别的\"。可无条件地信赖、尊重他人，是一种\"给予\"。不想付出、只求收获，你其实就是个\"心灵的乞丐\"——心灵的贫困者。《圣经》里有\"祷告，然后才有收获\"；而阿德勒会告诉你：\"付出，然后才有收获。\"不能坐等收获，不能做心灵的乞丐，要先主动去尊重、去信赖。\n\n而在这\"付出\"的尽头，矗立着阿德勒思想最终、也最重要的一道阶梯——\"爱\"。下一章，我们就将走进它。\n"}, {"title": "第五章 选择爱的人生", "text": "各位朋友，我们来到《幸福的勇气》的第五章，也是全书最深、最柔、也最重的一章——\"选择爱的人生\"。这是青年与哲人最后一夜的长谈。\n\n前面所有的铺垫——课题分离、尊重、信赖、共同体感觉——仿佛都是为了抵达这一个字：爱。\n\n可一谈起爱，世俗的理解就先入为主了。哲人先戳破一个幻觉。他说，社会上对爱的谈论，大多停留在\"神之爱\"\"动物之爱\"，或者干脆把它当成一种本能的冲动。阿德勒却反常识地指出：爱，不是命运决定、也不是自发\"被动坠入\"的东西；它\"需要在意志力的作用下，从无到有慢慢培养起来\"。人不应只等待\"被爱\"，而要\"主动去爱\"。\n\n他打了个尖刻又精准的比方。你说你深深爱上了一台商店橱窗里的德国制双镜头反光照相机，被欲望的风暴袭击，非要得到它不可。可一旦到手，半年不到你就厌倦了——因为你原本并不是想\"拍照\"，你只是想\"获得它、拥有它、征服它\"而已。哲人说，你口中的\"被动坠入的爱\"，本质就是这种拥有欲和征服欲，说到底，和物欲没什么两样。\n\n所以，阿德勒一贯主张的，从来不是\"被爱的方法\"，而是\"爱他人的方法\"——一种能动的、主动去爱的方法。他说：\"获得他人的爱很难。但是，'爱他人'更是难上好几倍的课题。\"\n\n为什么说爱是课题？因为我们所受的教育里，一个人能完成的课题（站立、走路、学问），以及和同伴共同完成的课题（工作），都有人教过；唯独\"由两个人共同完成的课题\"——也就是爱——从未有人教过我们。而爱要追求的，既不是\"我的幸福\"，也不是\"你的幸福\"，而是不可分割的\"我们的幸福\"。\n\n这就引出了全章最动人的一个转换——\"变换人生的主语\"。通过分工，我们追求\"我的幸福\"；通过交友，我们追求\"你的幸福\"；而爱，建立的是\"我们的幸福\"。爱，让\"人生的主语\"从\"我\"，变成了\"我们\"。为了幸福，应该让\"自我\"消失——这不是在利己和利他之间找平衡，而是把两者都排除掉。\n\n可人，天生是\"自我中心\"的。我们出生后，凭借脆弱，反过来支配大人，君临于\"世界的中心\"。如果总停留在自我中心性里，就永远无法自立。哲人说：\"自立，就是脱离自我中心性。\"而爱，恰恰是我们从\"自我\"中解放出来、实现自立、在真正意义上接纳世界的那条路；它再把我们，扩向更广阔的共同体感觉。\n\n青年不服：可人，毕竟是先\"被爱\"着长大的啊。哲人承认，在亲子关系里，孩子因为生存的需要，不得不选择\"被爱的生活方式\"——这是性命攸关的生存战略。问题在于，太多成年人，还停留在\"如何被爱\"这个基准上，迟迟不肯毕业。要摆脱被给予的爱的支配，唯一的出路，是拥有\"自己的爱\"，主动去爱。\n\n这里，哲人点出了一个让人心惊的真相：人，在意识上害怕\"不被爱\"，可在无意识里，真正惧怕的，是\"爱\"本身。主动去爱，不需要任何担保；可如果我们不能分离课题、不能爱自己，就会拿\"自卑情结\"当借口，迟迟不敢涉足爱。请记住这句话：\"爱，是你的课题；但是，对方如何回应你的爱，那是他人的课题，你根本无法掌控。你能做的，唯有分离课题，自己先去爱。\"\n\n于是，\"命中注定的人\"这个浪漫的神话，被阿德勒干脆利落地拆穿了。他说，自己根本不认可什么\"命中注定的人\"。我们追逐\"命中注定的人\"，其实是为了\"排除一切候选人\"——用这个借口，逃避与现实中的人建立关系的勇气，躲进幻想，一边感叹\"没有邂逅\"，一边亲手把眼前的人都排除掉。弗洛姆说得好：爱某个人，并非单单出于激烈感情，这是一种\"决心、决断、约定\"。\n\n讲到\"决断\"，哲人给了两个画面。一个是青年的窘态：你就像站在人生这一座舞场的角落里，旁观着跳舞的人们，感叹没人愿意与自己共舞，痴痴等待那个\"命中注定的人\"伸出手。哲人说，你该做的只有一件事——\"牵起身边人的手，尽情尽力地去跳舞。命运，由此开始。\"另一个，是婚姻的本质：结婚，不是选择\"对象\"，而是选择自己的\"生活方式\"。我们可以爱任何人；命运，不是被安排的，而是\"靠自己的手创造出来\"的。我们绝不可以做命运的仆人，必须做命运的主人——不是去追求命中注定的人，而是建立起可以称得上命运的关系。\n\n哲人还讲了一个\"怕黑少年\"的例子，道破自我中心的老底。一个孩子晚上怕黑，母亲关灯离开他就哭；母亲问为什么哭，他说\"因为太黑\"。可阿德勒洞察：黑暗不是问题，这孩子最怕的，是母亲离开。他通过哭泣、呼喊、不睡觉，把自己变成一个\"累赘\"，借此把母亲留在身边——这，就是\"通过展示脆弱来支配对方\"。我们成年后许多\"被爱\"的执念，根源与此并无二致。\n\n另一个例子更温柔：有个人一边说\"喜欢花\"，却任花盆里的花枯萎，不浇水、不倒盆、不考虑向阳性。哲人说，这个人确实喜欢\"观赏花\"，这是事实，却称不上\"爱花\"。爱，是一种更具献身精神的行为。青年由此承认，自己过去对待恋人的方式，不过是\"享乐性的爱\"——只贪恋爱的果实，回避爱的责任；真正缺少的，是\"主动去爱\"的勇气，也就是——获得幸福的勇气。\n\n全书走到这里，哲人准备结束这最后一夜。他说，世界很简单，人生也是一样；但是——\"保持单纯很难\"。因为云开雾散之后，并非乐园般的草原；主动去爱、自立起来、选择人生，是一条多么艰难的路。最大的转折点，是\"最初的一步\"；而真正考验你的，是踏出那一步之后，继续走下去的勇气。阿德勒心理学，不该被当成教条继承，而该被不断地、由每个人自己，更新下去。\n\n书的末尾，哲人留下一封给\"将要创造新时代的朋友们\"的信，也留给我们每个人一句话。这句话，值得你在每一个平凡的清晨，轻轻想起——\n\n主动去爱，自立起来，选择人生。\n\n世界很简单，人生也是一样。但是，保持单纯，很难。而这\"难\"，正是我们生而为人的、最珍贵的勇气所在。\n\n到这里，《幸福的勇气》的听读，就陪你走到了结尾。愿你带着这份勇气，去爱，去选择，去把\"我\"，慢慢活成\"我们\"。\n"}]};
const audio = document.getElementById('audio');
const listEl = document.getElementById('list');
const transcriptsEl = document.getElementById('transcripts');
const pTitle = document.getElementById('pTitle');
const pStat = document.getElementById('pStat');
const fill = document.getElementById('fill');
const bar = document.getElementById('bar');
const curEl = document.getElementById('cur');
const durEl = document.getElementById('dur');
const playBtn = document.getElementById('play');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const speedBtn = document.getElementById('speed');
let cur = -1;
const speeds = [1,1.25,1.5,0.75,1];
let si = 0;
function fmt(s){s=Math.max(0,Math.floor(s||0));const m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function playTrack(i){if(i<0||i>=BOOK.tracks.length)return;cur=i;const t=BOOK.tracks[i];audio.src=t.file;audio.playbackRate=speeds[si];pTitle.textContent=(String(t.index).padStart(2,'0'))+'. '+t.title;audio.play().then(()=>render()).catch(e=>console.warn(e));render();}
audio.onloadedmetadata=()=>{durEl.textContent=fmt(audio.duration);};
audio.ontimeupdate=()=>{if(audio.duration){fill.style.width=(audio.currentTime/audio.duration*100)+'%';}curEl.textContent=fmt(audio.currentTime);};
audio.onplay=()=>{playBtn.textContent='⏸';render();};
audio.onpause=()=>{playBtn.textContent='▶';render();};
audio.onended=()=>{if(cur+1<BOOK.tracks.length)playTrack(cur+1);else{playBtn.textContent='▶';render();}};
playBtn.addEventListener('click',()=>{if(cur<0){playTrack(0);return;}audio.paused?audio.play():audio.pause();});
prevBtn.addEventListener('click',()=>playTrack(Math.max(0,cur-1)));
nextBtn.addEventListener('click',()=>playTrack(Math.min(BOOK.tracks.length-1,cur+1)));
speedBtn.addEventListener('click',()=>{si=(si+1)%speeds.length;audio.playbackRate=speeds[si];speedBtn.textContent=speeds[si].toFixed(2).replace(/0$/,'')+'×';});
bar.addEventListener('click',e=>{if(audio.duration){const r=bar.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;}});
BOOK.tracks.forEach((t,i)=>{
  const li=document.createElement('li');li.className='ch';li.dataset.i=i;
  const idx=document.createElement('div');idx.className='idx';idx.textContent=String(t.index).padStart(2,'0');
  const meta=document.createElement('div');meta.className='meta';
  const ct=document.createElement('div');ct.className='ct';ct.textContent=t.title;
  const cd=document.createElement('div');cd.className='cd';cd.innerHTML='<span class="eq"><i></i><i></i><i></i><i></i></span>';
  meta.appendChild(ct);meta.appendChild(cd);
  const dur=document.createElement('div');dur.className='dur';dur.textContent=fmt(t.duration);
  li.appendChild(idx);li.appendChild(meta);li.appendChild(dur);
  li.addEventListener('click',()=>playTrack(i));
  listEl.appendChild(li);
});
BOOK.transcripts.forEach((tr)=>{
  const d=document.createElement('details');d.className='ts';
  const s=document.createElement('summary');s.textContent=tr.title;
  const c=document.createElement('div');c.className='tsc';c.textContent=tr.text;
  d.appendChild(s);d.appendChild(c);
  transcriptsEl.appendChild(d);
});
function render(){document.querySelectorAll('li.ch').forEach((li,i)=>{li.classList.toggle('active',i===cur);li.classList.toggle('playing',i===cur&&!audio.paused);});}
pStat.textContent='共 '+BOOK.tracks.length+' 章 · 约 '+(BOOK.tracks.reduce((a,b)=>a+b.duration,0)/60).toFixed(0)+' 分钟';
document.getElementById('total').textContent='总时长约 '+(BOOK.tracks.reduce((a,b)=>a+b.duration,0)/3600).toFixed(1)+' 小时 · '+BOOK.tracks.length+' 章';
</script>
</body>
</html>
